<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF5F1"><meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="孕期小幫手"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="apple-touch-icon.png"><link rel="icon" href="icon-192.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}[hidden]{display:none!important}</style>
</head><body>
<title>孕期小幫手</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* 版面：手機單欄 App，最寬 480px 置中；上方狀態列、下方膠囊分頁列，寶寶是畫面主角。 */
:root {
  --bg: #FFF5F1;        /* 嬰兒粉膚 */
  --surface: #FFFFFF;
  --surface-2: #FFEDEF;
  --ink: #4A3540;       /* 梅子棕，不用純黑 */
  --muted: #8E7580;
  --line: #F3DCE2;
  --accent: #F2708C;    /* 草莓粉 */
  --accent-ink: #FFFFFF;
  --mint: #3FB28E;
  --mint-soft: #DDF5EC;
  --sun: #F4B323;       /* 星星 */
  --sun-soft: #FFF1CC;
  --sky-soft: #E3F1FB;
  --danger: #D9434F;
  --danger-soft: #FFE3E3;
  --womb: #FFDCE4;
  --skin: #FFE2D2;
  --shadow: 0 6px 18px rgba(170, 90, 110, .12);
  --font-display: "Huninn", "PingFang TC", "Noto Sans TC", system-ui, sans-serif;
  --font-body: "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #221A1F; --surface: #30252B; --surface-2: #3B2C33; --ink: #FBEEF1; --muted: #C7AEB8; --line: #47363E;
    --accent: #FF8BA3; --accent-ink: #2A1A20; --mint: #6CD4B2; --mint-soft: #22392F; --sun: #FFCB55; --sun-soft: #3F3420;
    --sky-soft: #233340; --danger: #FF7A82; --danger-soft: #45252A; --womb: #4A2E38; --skin: #FFE2D2;
    --shadow: 0 6px 18px rgba(0, 0, 0, .35); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #221A1F; --surface: #30252B; --surface-2: #3B2C33; --ink: #FBEEF1; --muted: #C7AEB8; --line: #47363E;
  --accent: #FF8BA3; --accent-ink: #2A1A20; --mint: #6CD4B2; --mint-soft: #22392F; --sun: #FFCB55; --sun-soft: #3F3420;
  --sky-soft: #233340; --danger: #FF7A82; --danger-soft: #45252A; --womb: #4A2E38; --skin: #FFE2D2;
  --shadow: 0 6px 18px rgba(0, 0, 0, .35); color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
h1, h2, h3, .display { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; }
p { margin: 0; }
.app { max-width: 480px; margin: 0 auto; min-height: 100%; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-bottom: calc(96px + env(safe-area-inset-bottom, 0px)); }
.app.no-tabs { padding-bottom: 32px; }

/* 狀態列 */
.status { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 10px; padding-block: 12px 10px; }
.lv { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; }
.lv-badge { font-family: var(--font-display); background: var(--accent); color: var(--accent-ink); border-radius: 999px; padding: 2px 10px; font-size: 14px; white-space: nowrap; }
.bar { height: 10px; background: var(--surface-2); border-radius: 999px; overflow: hidden; flex: 1; min-width: 40px; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 999px; transition: width .4s; }
.bar.mint > i { background: var(--mint); }
.bar.sun > i { background: var(--sun); }
.chip { display: inline-flex; align-items: center; gap: 4px; background: var(--surface); border-radius: 999px; padding: 3px 10px; font-weight: 700; font-variant-numeric: tabular-nums; box-shadow: var(--shadow); white-space: nowrap; }
.gear { width: 36px; height: 36px; border-radius: 50%; background: var(--surface); box-shadow: var(--shadow); font-size: 17px; display: grid; place-items: center; flex: none; }
.demo-tag { font-size: 11px; color: var(--muted); border: 1px dashed var(--muted); border-radius: 6px; padding: 0 5px; white-space: nowrap; }

/* 通用 */
.stack { display: flex; flex-direction: column; gap: 14px; }
.card { background: var(--surface); border-radius: 24px; padding: 16px; box-shadow: var(--shadow); }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; align-items: center; gap: 10px; }
.between { justify-content: space-between; }
.grow { flex: 1; min-width: 0; }
.section-title { font-family: var(--font-display); font-size: 19px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; border-radius: 999px; padding: 11px 18px; font-weight: 700; background: var(--accent); color: var(--accent-ink); }
.btn.secondary { background: var(--surface-2); color: var(--ink); }
.btn.mint { background: var(--mint); color: #fff; }
.btn.danger { background: var(--danger-soft); color: var(--danger); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: default; }
.btn:active:not(:disabled), .tile:active, .quest:active { transform: scale(.97); }
.back { display: inline-flex; align-items: center; gap: 4px; padding-block: 12px 4px; color: var(--accent); font-weight: 700; }
.page-title { font-size: 26px; margin-block: 4px 12px; }
.note { font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.input { width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 16px; padding: 11px 14px; }
.pill-row { display: flex; gap: 8px; flex-wrap: wrap; }
.pill { border-radius: 999px; padding: 6px 13px; background: var(--surface); border: 2px solid var(--line); font-weight: 700; font-size: 14px; }
.pill[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

/* 寶寶主角卡 */
.hero { background: linear-gradient(170deg, var(--surface-2), var(--surface)); border-radius: 32px; padding: 18px 16px 16px; box-shadow: var(--shadow); text-align: center; position: relative; }
.hero .baby { width: min(62vw, 230px); margin: 0 auto; display: block; }
.bubble { display: inline-block; background: var(--surface); border-radius: 18px; padding: 7px 14px; font-weight: 700; box-shadow: var(--shadow); position: relative; margin-bottom: 4px; }
.bubble::after { content: ""; position: absolute; left: 50%; bottom: -7px; margin-left: -7px; border: 7px solid transparent; border-top-color: var(--surface); border-bottom: 0; }
.hero-title { font-size: 28px; line-height: 1.2; }
.hero-sub { color: var(--muted); font-weight: 500; }
.bob { animation: bob 3.2s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-6px) rotate(-1.5deg); } }
.zzz { animation: zzz 2.6s ease-in-out infinite; }
@keyframes zzz { 0% { opacity: 0; transform: translate(0, 6px); } 40% { opacity: 1; } 100% { opacity: 0; transform: translate(8px, -14px); } }

/* 大按鈕 */
.tiles { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.tile { background: var(--surface); border-radius: 22px; padding: 12px 4px 10px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 700; font-size: 14px; transition: transform .1s; }
.tile .ico { font-size: 28px; width: 48px; height: 48px; border-radius: 16px; display: grid; place-items: center; }
.tile.on { outline: 3px solid var(--mint); }
.ico.pink { background: var(--surface-2); } .ico.mint { background: var(--mint-soft); } .ico.sun { background: var(--sun-soft); } .ico.sky { background: var(--sky-soft); }

/* 任務 */
.quest { display: flex; align-items: center; gap: 12px; padding: 12px 14px; background: var(--surface); border-radius: 20px; box-shadow: var(--shadow); text-align: left; width: 100%; transition: transform .1s; }
.quest .q-emoji { font-size: 26px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--surface-2); border-radius: 14px; flex: none; }
.quest .q-title { font-weight: 700; }
.quest .q-tip { font-size: 12.5px; color: var(--muted); }
.quest .check { width: 30px; height: 30px; border-radius: 50%; border: 3px solid var(--line); flex: none; display: grid; place-items: center; font-size: 15px; color: #fff; }
.quest.done .check { background: var(--mint); border-color: var(--mint); }
.quest.done .q-title { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--mint); }
.reward { font-weight: 700; color: var(--sun); white-space: nowrap; font-size: 13px; }
.auto-tag { font-size: 11px; color: var(--mint); font-weight: 700; }

/* 知識題 */
.quiz-emoji { font-size: 44px; text-align: center; }
.quiz-prompt { font-family: var(--font-display); font-size: 21px; text-align: center; line-height: 1.35; }
.options { display: grid; gap: 10px; }
.option { padding: 13px; border-radius: 18px; background: var(--surface-2); font-weight: 700; font-size: 16px; }
.option.right { background: var(--mint); color: #fff; }
.option.wrong { background: var(--danger-soft); color: var(--danger); }
.explain { background: var(--sun-soft); border-radius: 18px; padding: 12px 14px; white-space: pre-line; }

/* 圓環 */
.rings { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.ring { text-align: center; font-size: 13px; font-weight: 700; }
.ring svg { width: 78px; height: 78px; display: block; margin: 0 auto 2px; }
.ring-track { stroke: var(--surface-2); }
.ring-text { fill: var(--ink); font-family: var(--font-display); }

/* 技能路線 */
.path { display: flex; flex-direction: column; align-items: center; gap: 6px; padding-block: 8px; }
.node { display: flex; flex-direction: column; align-items: center; gap: 4px; width: 150px; text-align: center; }
.node .dot { width: 70px; height: 70px; border-radius: 50%; display: grid; place-items: center; font-size: 30px; background: var(--surface); box-shadow: var(--shadow), inset 0 -5px 0 rgba(0,0,0,.06); border: 4px solid var(--line); }
.node.learned .dot, .node.claimed .dot { background: var(--mint); border-color: var(--mint); }
.node.training .dot, .node.ready .dot { border-color: var(--accent); background: var(--surface-2); animation: pulse 1.8s ease-in-out infinite; }
.node.locked .dot { filter: grayscale(1); opacity: .45; }
.node.selected .dot { outline: 4px solid var(--sun); outline-offset: 3px; }
.node .n-title { font-weight: 700; font-size: 14px; line-height: 1.3; }
.node .n-sub { font-size: 12px; color: var(--muted); }
.node.off-1 { transform: translateX(-62px); } .node.off-3 { transform: translateX(62px); }
.connector { width: 6px; height: 18px; border-radius: 3px; background: var(--line); }
@keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.06); } }

/* 衣櫃 */
.wardrobe { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.outfit { background: var(--surface); border-radius: 20px; padding: 8px 4px; box-shadow: var(--shadow); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 13px; font-weight: 700; border: 3px solid transparent; }
.outfit svg { width: 72px; height: 72px; }
.outfit.sel { border-color: var(--accent); }
.outfit.locked svg { filter: grayscale(.9); opacity: .5; }
.outfit .o-sub { font-size: 11.5px; color: var(--muted); font-weight: 500; }
.outfit .o-sub.on { color: var(--mint); font-weight: 700; }

/* 百科 */
.kb-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
.kb { background: var(--surface); border-radius: 22px; padding: 14px; box-shadow: var(--shadow); text-align: left; display: flex; flex-direction: column; gap: 6px; }
.kb .ico { font-size: 26px; width: 46px; height: 46px; border-radius: 15px; display: grid; place-items: center; }
.kb b { font-size: 16px; }
.kb span { font-size: 12.5px; color: var(--muted); line-height: 1.4; }
.food { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; align-items: start; }
.verdict { border-radius: 10px; padding: 3px 8px; font-weight: 700; font-size: 13px; white-space: nowrap; }
.verdict.avoid { background: var(--danger-soft); color: var(--danger); }
.verdict.limit { background: var(--sun-soft); color: #A86E00; }
.verdict.ok { background: var(--mint-soft); color: var(--mint); }
:root[data-theme="dark"] .verdict.limit { color: var(--sun); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .verdict.limit { color: var(--sun); } }
.tip { font-size: 13px; color: var(--muted); }
.list { margin: 0; padding-left: 1.2em; display: grid; gap: 4px; }
.timeline-item { display: flex; align-items: center; gap: 10px; padding-block: 8px; border-bottom: 1px solid var(--line); }
.timeline-item:last-child { border-bottom: 0; }
.time { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 13px; width: 44px; flex: none; }
.x { width: 30px; height: 30px; border-radius: 50%; color: var(--muted); flex: none; }
.big-timer { font-family: var(--font-display); font-size: 56px; text-align: center; font-variant-numeric: tabular-nums; line-height: 1.1; }
.kick-btn { width: 190px; height: 190px; border-radius: 50%; margin: 6px auto; display: grid; place-items: center; background: var(--accent); color: var(--accent-ink); font-family: var(--font-display); font-size: 26px; box-shadow: 0 12px 0 rgba(180, 60, 90, .25), var(--shadow); line-height: 1.2; }
.kick-btn:active { transform: translateY(6px); box-shadow: 0 6px 0 rgba(180, 60, 90, .25); }
.warn { background: var(--danger-soft); border-radius: 22px; padding: 16px; }
.warn h3 { color: var(--danger); font-size: 18px; margin-bottom: 8px; }
.range { width: 100%; accent-color: var(--accent); }

/* 分頁列 */
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 8px max(12px, env(safe-area-inset-left, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(12px, env(safe-area-inset-right, 0px)); pointer-events: none; }
.tabbar-inner { max-width: 456px; margin: 0 auto; background: var(--surface); border-radius: 999px; box-shadow: 0 8px 28px rgba(150, 70, 95, .22); display: grid; grid-template-columns: repeat(5, 1fr); padding: 6px; pointer-events: auto; }
.tab { display: flex; flex-direction: column; align-items: center; font-size: 12px; font-weight: 700; color: var(--muted); padding: 5px 0; border-radius: 999px; line-height: 1.2; }
.tab .t-ico { font-size: 22px; }
.tab[aria-current="page"] { background: var(--surface-2); color: var(--accent); }

/* 底部選單與提示 */
.sheet-bg { position: fixed; inset: 0; background: rgba(40, 20, 30, .4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 480px; border-radius: 28px 28px 0 0; padding: 18px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 12px; animation: up .22s ease-out; }
@keyframes up { from { transform: translateY(40px); opacity: 0; } }
.sheet-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
.toast { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); border-radius: 20px; padding: 12px 18px; font-weight: 700; text-align: center; white-space: pre-line; box-shadow: var(--shadow); max-width: calc(100% - 32px); animation: drop .3s ease-out; }
@keyframes drop { from { transform: translate(-50%, -20px); opacity: 0; } }

/* 首次使用 */
.welcome { padding-block: 24px; display: flex; flex-direction: column; gap: 16px; }
.welcome h1 { font-size: 34px; text-align: center; }
.field { display: grid; gap: 6px; font-weight: 700; }

@media (max-width: 360px) { .tiles { grid-template-columns: repeat(2, 1fr); } .node.off-1 { transform: translateX(-40px); } .node.off-3 { transform: translateX(40px); } }
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }
</style>

<div class="app" id="app"></div>
<nav class="tabbar" id="tabbar" aria-label="主要分頁" hidden>
  <div class="tabbar-inner">
    <button class="tab" data-act="tab" data-arg="home"><span class="t-ico">🏠</span>家</button>
    <button class="tab" data-act="tab" data-arg="quests"><span class="t-ico">⭐️</span>任務</button>
    <button class="tab" data-act="tab" data-arg="skills"><span class="t-ico">🌱</span>技能</button>
    <button class="tab" data-act="tab" data-arg="wardrobe"><span class="t-ico">👕</span>衣櫃</button>
    <button class="tab" data-act="tab" data-arg="wiki"><span class="t-ico">📖</span>百科</button>
  </div>
</nav>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>

<script src="data.js"></script>
<script src="app.js"></script>
</body></html>
